<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>MiaHotel</title>
        <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
        <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
        <link rel="shortcut icon" href="https://ih1.redbubble.net/image.2870132373.1841/bg,f8f8f8-flat,750x,075,f-pad,750x1000,f8f8f8.u1.jpg" type="image/x-icon" />
        <link rel="stylesheet" href="./font-awesome-6.5.1-pro-full/css/all.css" />
        <link rel="stylesheet" href="style.css" />
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    </head>
    <body>
        <header class="bg-rose-900 overflow-hidden flex flex-col">
            <div class="flex flex-col mx-50">
                <div class="flex text-white p-5 justify-between">
                    <a href="index.html" class="lobster-two-regular text-xl">MiaHotel</a>
                    <div class="flex gap-6">
                        <select name="currency" id="" class="font-bold bg-rose-900">
                            <option value="">VND</option>
                            <option value="">EUR</option>
                            <option value="">USD</option>
                        </select>
                        <a href="regis.html" class="bg-white text-rose-800 rounded-sm py-1.5 px-3 font-medium shadow-md">Register</a>
                        <a href="log.html" class="bg-white text-rose-800 rounded-sm py-1.5 px-3 font-medium shadow-md">Sign in</a>
                    </div>
                </div>
            </div>
        </header>
        <section class="mt-5">
            <p class="text-center text-3xl font-bold text-rose-900 mb-2">Room Adding</p>
            <div class="mx-100">
                <div class="flex gap-10 bg-slate-100 rounded-sm">
                    <div class="flex flex-col w-500">
                        <label for="" class="mb-1">Name room</label>
                        <input id="name-room" type="text" placeholder="ex. standard room" class="input mb-3" />
                        <label for="" class="mb-1">Location</label>
                        <input id="location-room" type="text" placeholder="ex. Dong Nai, Viet Nam" class="input mb-3" />
                        <label for="" class="mb-1">Person</label>
                        <input id="person-room" type="text" placeholder="ex. 1 adult, 1 child" class="input mb-3" />
                        <label for="" class="mb-1">Description</label>
                        <input id="desc-room" type="text" placeholder="ex. large bath, twin bed, include breakfast" class="textarea mb-3" />
                        <label for="" class="mb-1">Price</label>
                        <div class="flex">
                            <input id="price-room" type="text" placeholder="ex. 350,000" class="input mb-3" />
                            <p class="text-2xl ml-2 text-red-500">VND/Night</p>
                        </div>
                    </div>
                    <div>
                        <img id="image-preview" src="" alt="" class="w-[300px] h-50 border mt-20" />
                        <label for="" class="mb-1">URL</label>
                        <input type="text" placeholder="image url" class="input mb-3" id="image-url" />
                    </div>
                </div>
                <button id="btn-add-room" class="text-white bg-rose-800 rounded-sm py-2 px-15 font-medium shadow-md hover:text-rose-900 hover:bg-white duration-200 cursor-pointer mt-2">
                    Add Room
                </button>
            </div>
        </section>
        <footer class="bg-slate-200 h-50 mt-20 overflow-hidden">
            <p class="text-center text-sm">Copyright &copy; 2025 Miahotel</p>
            <p class="text-center text-sm mt-2">VietNam</p>
            <div class="flex">
                <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/a/a4/Agoda_logo_2019.svg/330px-Agoda_logo_2019.svg.png" alt="" class="scale-20" />
                <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/b/be/Booking.com_logo.svg/2560px-Booking.com_logo.svg.png" alt="" class="scale-10 -ml-160" />
            </div>
        </footer>
        <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
        <script src="./java/add-room.js"></script>
    </body>
</html>
